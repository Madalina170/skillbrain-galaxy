<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="styles2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<body>
    <div class="header">
        <div class="logo-block">
            <img src="assets/icon.png" alt="Logo"/>

        </div>
        <div class="menu-block">
            <div class="menu-list">
                <a href="#Product">Product</a>
                <a href="#Customers">Customers</a>
                <a href="#Pricing">Pricing</a>
                <a href="#Resources">Resources</a>
            </div>
            <div>
                <a href="#button-secondary" class="secondary button">Sign In</a>
                <a href="#button-primary" class="primary button">Sign Up</a>
            </div>
        </div>
    </div>
    
    <div class="content">
        <img src="assets/amico.png" class="social-img" alt="Social"/>
        <div class="body-copy">
            <h1 class="title-xl">Work at the speed of thought</h1>
            <p class="paragraph">Tools, tutorials, design and innovation experts, all in one place! The most intuitive way to imagine your next user experience.</p>
